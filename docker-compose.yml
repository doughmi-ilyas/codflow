services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codflow
      POSTGRES_PASSWORD: codflow
      POSTGRES_DB: codflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dbdata:/var/lib/postgresql/data
  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://codflow:codflow@db:5432/codflow
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your environment}
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
volumes:
  dbdata:
