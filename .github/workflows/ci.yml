name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codflow
          POSTGRES_PASSWORD: codflow
          POSTGRES_DB: codflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codflow" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Tests against a real PostgreSQL (row-level security included)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://codflow:codflow@localhost:5432/codflow_test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t codflow-api ./api
      - run: docker build -t codflow-web ./web
